[package]
name = "omega"
version = "0.1.0"
edition = "2024"
description = "Project Omega, layer 1: atom-scale simulation code written from the ground up."
license = "MIT OR Apache-2.0"
default-run = "omega"

[dependencies]
softbuffer = { version = "0.4.8", optional = true }
winit = { version = "0.30.13", optional = true }

[features]
viewer = ["dep:softbuffer", "dep:winit"]

[[bin]]
name = "view"
path = "src/bin/view/main.rs"
required-features = ["viewer"]